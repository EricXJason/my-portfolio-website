<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Neon Glow Gradient -->
    <linearGradient id="cyber-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <!-- Dark Emblem Radial Background -->
    <radialGradient id="dark-bg" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#07090e" />
    </radialGradient>
  </defs>

  <!-- Background Circle with Neon Border -->
  <circle cx="256" cy="256" r="240" fill="url(#dark-bg)" stroke="url(#cyber-gradient)" stroke-width="16" />

  <!-- Concentric Dash Circle (Tech Ring) -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#cyber-gradient)" stroke-width="4" stroke-dasharray="16 20" opacity="0.65" />

  <!-- Futuristic Geometric Font for <JP/> -->
  <text x="256" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Fira Code', 'Outfit', monospace" font-weight="900" font-size="115" fill="url(#cyber-gradient)" text-anchor="middle" letter-spacing="-2">
    &lt;JP/&gt;
  </text>
</svg>